    ImportFromUrlRequest:
      type: object
      description: "Create one Zotero item from a source URL. Methods are tried in order until one identifies the source as exactly one work: web translators, the page embedded metadata (for a PDF: Zotero PDF recognition), identifier discovery (DOI, ISBN, arXiv ID), BibTeX the page links, and external services (Crossref, zbMATH Open, arXiv, Open Library). When the work is already in the library (equal DOI; equal ISBN between books; or equal URL together with an equal title), the existing item is returned with existing true and gains the requested collections; nothing else about it changes. The item stores the full text Zotero gets for the source: the translator's attachments, an open-access PDF when the translator gives none, and the PDF itself when the URL is a PDF. With store_attachments false, a new item stores none of these. When no method identifies the source, the 422 names alternative sources in details.remediation; a second request with fallback_metadata then saves the source as the caller describes it."
      required:
        - operation
        - url
      properties:
        operation:
          const: import_from_url
        url:
          allOf:
            - $ref: '#/components/schemas/NonBlankString'
          format: uri
          description: An http or https URL.
        collection_keys:
          $ref: '#/components/schemas/NormalizedStringArray'
        fallback_metadata:
          $ref: '#/components/schemas/FallbackMetadata'
        store_attachments:
          type: boolean
          default: true
          description: 'false: the call stores no attachments. A new item gets no translator attachment, no open-access PDF and no PDF of the source, so the caller can attach its own copy. An existing item is not changed. Servers that support this field list import_store_attachments in /version capabilities.'
    ImportFromUrlAttempt:
      type: object
      required:
        - method
        - outcome
        - message
      properties:
        method:
          $ref: '#/components/schemas/ImportFromUrlMethod'
        outcome:
          enum:
            - identified
            - no_match
            - ambiguous
            - failed
        message:
          type: string
      additionalProperties: false
    ImportFromUrlMethod:
      enum:
        - web_translator
        - page_metadata
        - identifier
        - published_bibtex
        - external_service
        - pdf_recognition
    ImportFromUrlSuccess:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required:
            - item_key
            - item_id
            - method
            - existing
            - details
            - citation_key
          properties:
            operation:
              const: import_from_url
            item_key:
              type: string
            item_id:
              type: integer
            method:
              anyOf:
                - $ref: '#/components/schemas/ImportFromUrlMethod'
                - const: caller_metadata
                  description: No method identified the source; the item was made from fallback_metadata.
            existing:
              type: boolean
              description: true when the work was already in the library and that item is returned.
            details:
              type: object
              required:
                - url
                - final_url
                - collection_keys
                - translator
                - attempts
                - attachment_failures
              properties:
                url:
                  type: string
                final_url:
                  type: string
                  description: The URL after redirects.
                collection_keys:
                  type: array
                  items:
                    type: string
                translator:
                  oneOf:
                    - type: 'null'
                    - type: object
                      required:
                        - translator_id
                        - label
                      properties:
                        translator_id:
                          type: string
                        label:
                          type: string
                      additionalProperties: false
                attempts:
                  type: array
                  items:
                    $ref: '#/components/schemas/ImportFromUrlAttempt'
                attachment_failures:
                  type: array
                  description: Attachments the translator named that Zotero could not store. The item is saved without them.
                  items:
                    type: object
                    required:
                      - title
                      - url
                      - error
                    properties:
                      title:
                        type:
                          - string
                          - 'null'
                        description: Null when the translator named no title.
                      url:
                        type:
                          - string
                          - 'null'
                        description: Null when the translator named no URL.
                      error:
                        type: string
                    additionalProperties: false
            citation_key:
              type: string
              description: The Better BibTeX citation key of the item (Zotero's citationKey field).
      unevaluatedProperties: false
    ResolveUrlRequest:
      type: object
      description: Identify a source URL exactly as import_from_url does, with the same methods in the same order, and return the metadata of the one work it identifies without saving anything to the library. The metadata is Zotero's CSL-JSON rendering of the item import_from_url would create.
      required:
        - operation
        - url
      properties:
        operation:
          const: resolve_url
        url:
          allOf:
            - $ref: '#/components/schemas/NonBlankString'
          format: uri
          description: An http or https URL.
    ResolveUrlSuccess:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required:
            - method
            - item_type
            - csl
            - details
          properties:
            operation:
              const: resolve_url
            method:
              $ref: '#/components/schemas/ImportFromUrlMethod'
            item_type:
              type: string
              description: The Zotero item type of the identified work.
            csl:
              type: object
              description: The identified work as CSL-JSON (Zotero.Utilities.Item.itemToCSLJSON).
              required:
                - type
              properties:
                type:
                  type: string
              additionalProperties: true
            details:
              type: object
              required:
                - url
                - final_url
                - translator
                - attempts
              properties:
                url:
                  type: string
                final_url:
                  type: string
                  description: The URL after redirects.
                translator:
                  oneOf:
                    - type: 'null'
                    - type: object
                      required:
                        - translator_id
                        - label
                      properties:
                        translator_id:
                          type: string
                        label:
                          type: string
                      additionalProperties: false
                attempts:
                  type: array
                  items:
                    $ref: '#/components/schemas/ImportFromUrlAttempt'
      unevaluatedProperties: false
    FallbackMetadata:
      type: object
      description: "The caller's description of a source that no method identifies. import_from_url uses it only after every method failed: the item gets this title, these creators as authors, this year as its date, the source URL, the tag metadata:unresolved, and, when the URL is a PDF, that PDF stored under it. Better BibTeX mints the citation key from these fields."
      required:
        - title
        - creators
        - year
      properties:
        title:
          $ref: '#/components/schemas/NonBlankString'
        creators:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - last_name
            properties:
              first_name:
                type: string
              last_name:
                $ref: '#/components/schemas/NonBlankString'
            additionalProperties: false
        year:
          type: string
          pattern: ^[0-9]{4}$
      additionalProperties: false
    SourceRemediation:
      type: object
      required:
        - message
        - alternative_sources
        - fallback_field
      properties:
        message:
          type: string
        alternative_sources:
          type: array
          items:
            type: object
            required:
              - name
              - example
            properties:
              name:
                type: string
              example:
                type: string
                description: The form of a URL or identifier at this source.
            additionalProperties: false
        fallback_field:
          const: fallback_metadata
      additionalProperties: false
    SourceNotIdentifiedResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          required:
            - stage
            - details
          properties:
            stage:
              const: identify_source
            details:
              type: object
              required:
                - request
                - attempts
                - remediation
              properties:
                attempts:
                  type: array
                  items:
                    $ref: '#/components/schemas/ImportFromUrlAttempt'
                remediation:
                  $ref: '#/components/schemas/SourceRemediation'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Optional shared token. When the extensions.zotero.localWriteAPI.token preference is set in Zotero, /write and /attach require Authorization: Bearer <token>. With the preference unset (the loopback-only default), no authentication is required.'
