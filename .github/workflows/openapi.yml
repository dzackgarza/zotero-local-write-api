name: OpenAPI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  static-contract:
    name: Static contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      # build.py runs via `uv run` (PEP 723 inline deps); the build-artifacts
      # test shells out to it.
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5

      - name: Install dependencies (frozen)
        run: bun install --frozen-lockfile

      - name: Lint, drift check, dispatch conformance, typecheck, tests
        run: |
          bun run openapi:lint
          bun run openapi:check-generated
          bun run openapi:contract
          bun run typecheck
          bun test

  oasdiff:
    name: oasdiff (validate, breaking, changelog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      # The base branch may not yet contain openapi.yaml (this is the
      # bootstrap PR that introduces it). In that case oasdiff must compare
      # against a valid empty document so the diff shows the whole API as
      # additions and the breaking check has no false breakages. A committed
      # fake baseline is never used.
      # The base spec must live inside the workspace: the oasdiff actions run
      # in Docker with only $GITHUB_WORKSPACE mounted at their working
      # directory, so a $RUNNER_TEMP path does not exist in the container.
      - name: Resolve base schema
        id: base
        env:
          # Expanded via env, not inline ${{ }}, so a crafted branch name
          # cannot inject into the shell.
          BASE_REF: ${{ github.base_ref || github.ref_name }}
        run: |
          base_ref="${BASE_REF}"
          if git cat-file -e "origin/${base_ref}:openapi.yaml" 2>/dev/null; then
            git show "origin/${base_ref}:openapi.yaml" > base-openapi.yaml
            echo "Base schema found on origin/${base_ref}."
          else
            printf 'openapi: 3.1.0\ninfo:\n  title: Zotero Local Write API\n  version: 0.0.0\npaths: {}\n' \
              > base-openapi.yaml
            echo "No base schema on origin/${base_ref}; using ephemeral empty document."
          fi
          echo "path=base-openapi.yaml" >> "$GITHUB_OUTPUT"

      - name: Validate revised schema
        uses: oasdiff/oasdiff-action/validate@033c15c845bef10f148afb0fa781bf1b2a7fe1bf # v0
        with:
          # The validate action's input is `spec`; `file` is silently ignored
          # and the action then fails with "failed to load original spec".
          spec: openapi.yaml
          fail-on: WARN

      - name: Breaking-change check vs base
        uses: oasdiff/oasdiff-action/breaking@033c15c845bef10f148afb0fa781bf1b2a7fe1bf # v0
        with:
          base: ${{ steps.base.outputs.path }}
          revision: openapi.yaml
          fail-on: WARN

      - name: Changelog (markdown)
        uses: oasdiff/oasdiff-action/changelog@033c15c845bef10f148afb0fa781bf1b2a7fe1bf # v0
        with:
          base: ${{ steps.base.outputs.path }}
          revision: openapi.yaml
          format: markdown
          output-to-file: openapi-changelog.md

      - name: Append changelog to step summary
        if: always()
        run: |
          if [[ -s openapi-changelog.md ]]; then
            {
              echo '## OpenAPI changelog'
              echo
              cat openapi-changelog.md
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload changelog artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openapi-changelog
          path: openapi-changelog.md
          if-no-files-found: ignore
