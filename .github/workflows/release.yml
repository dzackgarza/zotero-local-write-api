name: Release
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      # openapi:check-generated formats the generator output with ai-review-ci's biome config, as the commit hook does.
      - name: Canonical formatter config
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: dzackgarza/ai-review-ci
          path: .ai-review-ci
          sparse-checkout: tool-configs/biome.json
          sparse-checkout-cone-mode: false
      - name: Install dependencies
        run: |
          pip install pyyaml
          bun install --frozen-lockfile
      - name: Check OpenAPI contract
        run: bun run openapi:check
        env:
          AI_REVIEW_CI_CONFIGS: ${{ github.workspace }}/.ai-review-ci/tool-configs
      - name: Build XPI
        run: python3 build.py
      - name: Get version
        id: ver
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: local-write-api-${{ steps.ver.outputs.version }}.xpi
          generate_release_notes: true
